vulnerability:
  name: Hardcoded Mobile App Secrets
  category: mobile
  description: Hardcoded API keys, Bearer tokens, or credentials embedded in mobile APK/IPA binaries.

attack_surface: mobile

detection_patterns:
  - "AKIA"
  - "eyJ"
  - "firebase.io"

validation_steps:
  - Decompile APK/IPA using jadx/baksmali.
  - Grep for API credentials and secret tokens.

evidence_requirements:
  - Recovered secret strings verified against live API endpoints.

severity_mapping: High

related_skills:
  - apk-redteam-pipeline
  - ios-redteam-pipeline
