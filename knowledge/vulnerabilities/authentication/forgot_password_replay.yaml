vulnerability:
  name: "Password Reset Token Replay & Exposure"
  category: "authentication"
  description: "Account recovery weaknesses where reset tokens are leaked in API responses or remain valid after initial password reset consumption."

attack_surface: "authentication"

detection_patterns:
  - "/api/auth/forgot-password"
  - "/api/auth/reset-password"
  - "reset_token="
  - "recovery_code="

validation_steps:
  - "Trigger password reset flow for test account."
  - "Inspect API response body for leaked reset tokens or URLs."
  - "Complete password reset once using the generated token."
  - "Attempt to reuse the identical reset link/token a second time to verify token invalidation."

evidence_requirements:
  - "API response exposing reset token or successful password alteration using an already-consumed token."

severity_mapping: "High"

related_skills:
  - "hunt-forgot-password"
  - "hunt-ato"
