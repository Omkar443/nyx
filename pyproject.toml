[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-security-engine"
version = "1.0.0"
description = "NYX Security Intelligence Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Omkar443" }]
keywords = ["security", "bug-bounty", "recon", "antigravity", "nyx", "pentest", "red-team"]
dependencies = []

[project.optional-dependencies]
http = ["requests"]

[project.urls]
Homepage = "https://github.com/Omkar443/nyx"
Documentation = "https://github.com/Omkar443/nyx/blob/main/README.md"

[project.scripts]
nyx = "nyx_cli.cli:main"

[tool.setuptools]
packages = ["nyx_cli", "nyx", "nyx.api", "nyx.application", "nyx.core", "nyx.execution", "nyx.infrastructure", "nyx.interface", "nyx.models", "nyx.recon", "nyx.security", "nyx.validation", "nyx.worker", "nyx.distributed", "nyx.browser", "nyx.runtime", "nyx.auth", "nyx.agents", "nyx.intelligence", "nyx.monitor", "nyx.alerts", "nyx.research", "nyx.knowledge"]

[tool.setuptools.package-data]
nyx_cli = ["data/*.json"]
