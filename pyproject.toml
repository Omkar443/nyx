[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-security-engine"
version = "1.0.0"
description = "NYX Security Intelligence Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Omkar" }]
keywords = ["security", "bug-bounty", "recon", "antigravity", "nyx", "pentest", "red-team"]
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
http = ["requests", "httpx"]
web = ["fastapi>=0.100.0", "uvicorn>=0.20.0", "pydantic>=2.0.0"]
ai = ["google-genai", "openai", "anthropic"]
all = [
    "requests",
    "httpx",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "google-genai",
    "openai",
    "anthropic",
]

[project.urls]
Homepage = "https://github.com/Omkar443/nyx"
Documentation = "https://github.com/Omkar443/nyx/blob/main/README.md"

[project.scripts]
nyx = "nyx_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nyx*", "nyx_cli*"]

[tool.setuptools.package-data]
nyx_cli = ["data/*.json"]
